<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | London Bright Cleaners</title>
    <meta name="robots" content="noindex">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #003459; color: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; padding: 20px; }
        .box { max-width: 500px; }
        .check { font-size: 4rem; color: #28a745; margin-bottom: 20px; }
        h1 { font-size: 2rem; margin-bottom: 16px; }
        p { font-size: 1.1rem; opacity: 0.9; margin-bottom: 28px; line-height: 1.6; }
        .btn { display: inline-block; padding: 14px 32px; background: #ffb703; color: #1a1a2e; border-radius: 30px; font-weight: 600; text-decoration: none; }
        .btn:hover { background: #ffa500; }
        .phone { margin-top: 20px; font-size: 0.95rem; opacity: 0.8; }
        .phone a { color: #00a8e8; }
    </style>
</head>
<body>
    <div class="box">
        <div class="check">&#10004;</div>
        <h1>Thank You!</h1>
        <p>Your enquiry has been sent. We'll be in touch within 2 hours. For urgent requests, give us a call.</p>
        <a href="/" class="btn">Back to Homepage</a>
        <div class="phone">Need to talk now? Call <a href="tel:07777776528">07777 776528</a></div>
    </div>
</body>
</html>
